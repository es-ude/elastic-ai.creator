name: Coverage comment

# Comments the coverage report on pull requests, including those from forks.
# The token of the pull_request run of "Checks" is read-only for forks, so that
# workflow only uploads the report as an artifact and this one, which runs in
# the context of the base repository, comments it.
#
# SECURITY: this workflow has a write token. It must never check out or run code
# of the pull request. The artifact is untrusted data and is only parsed.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]

permissions:
  actions: read # download the artifact of the triggering run
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Comment coverage report
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Create comment
        id: comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from collections import defaultdict
          from pathlib import Path
          from xml.etree import ElementTree

          artifact = Path("coverage-artifact")

          pr_number = (artifact / "pr-number").read_text().strip()
          if not re.fullmatch(r"[0-9]{1,9}", pr_number):
              sys.exit("invalid pull request number")

          root = ElementTree.parse(artifact / "coverage.xml").getroot()
          total_lines = int(root.get("lines-valid", 0))
          total_covered = int(root.get("lines-covered", 0))

          covered: dict[str, int] = defaultdict(int)
          lines: dict[str, int] = defaultdict(int)
          for cls in root.iter("class"):
              name = re.sub(r"[^\w./-]", "_", cls.get("filename", ""))
              for line in cls.findall("lines/line"):
                  lines[name] += 1
                  if line.get("hits") != "0":
                      covered[name] += 1

          # changed files of the pull request, only the metadata is read
          changed = json.loads(
              subprocess.run(
                  [
                      "gh", "api", "--paginate", "--slurp",
                      f"repos/{os.environ['REPO']}/pulls/{pr_number}/files?per_page=100",
                  ],
                  check=True, capture_output=True, text=True,
              ).stdout
          )
          status = {
              re.sub(r"[^\w./-]", "_", f["filename"]): f["status"]
              for page in changed
              for f in page
          }

          def percent(cov: int, count: int) -> int:
              return round(100 * cov / count) if count else 100

          def icon(pct: int, threshold: int = 80) -> str:
              return "\U0001f7e2" if pct >= threshold else "\U0001f534"

          def table(names: list[str]) -> list[str]:
              rows = [
                  "| File | Coverage | Status |",
                  "| :--- | :------: | :----: |",
              ]
              for n in names:
                  pct = percent(covered[n], lines[n])
                  rows.append(f"| {n} | {pct}% | {icon(pct)} |")
              count = sum(lines[n] for n in names)
              pct = percent(sum(covered[n] for n in names), count)
              rows.append(f"| **TOTAL** | **{pct}%** | {icon(pct)} |")
              return rows

          OVERALL_THRESHOLD = 0
          overall = percent(total_covered, total_lines)
          new = sorted(n for n in lines if status.get(n) == "added")
          modified = sorted(
              n for n in lines if status.get(n) in ("modified", "renamed", "changed")
          )
          sha = os.environ["HEAD_SHA"][:7]
          body = [
              "# \u2602\ufe0f Python Coverage",
              "",
              "## Overall Coverage",
              "| Lines | Covered | Coverage | Threshold | Status |",
              "| :---: | :-----: | :------: | :-------: | :----: |",
              f"| {total_lines} | {total_covered} | {overall}% | {OVERALL_THRESHOLD}% | {icon(overall, OVERALL_THRESHOLD)} |",
              "",
              "## New Files",
              *(table(new) if new else ["No new covered files..."]),
              "",
              "## Modified Files",
              *(table(modified) if modified else ["No covered modified files..."]),
              "",
              f"> updated for commit: `{sha}`",
          ]
          Path("comment.md").write_text("\n".join(body) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"pr-number={pr_number}\n")
          PY
      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: coverage
          pr-number: ${{ steps.comment.outputs.pr-number }}
          file-path: comment.md
